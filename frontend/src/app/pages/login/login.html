
<div class="auth-page">
  <div class="auth-card">

    <div class="brand">
      <div class="brand-icon">+</div>
      <h1>TeleMedecine</h1>
      <p>Votre santé, notre priorité</p>
    </div>

    <h2>Connexion</h2>

    <p class="subtitle">
      Connectez-vous à votre espace personnel
    </p>

    <form
      #loginForm="ngForm"
      (ngSubmit)="onSubmit()"
      novalidate
    >
      <div class="form-group">
        <label for="email">Adresse e-mail</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="exemple@email.com"
          autocomplete="email"
          required
          email
          [disabled]="isLoading"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Votre mot de passe"
          autocomplete="current-password"
          required
          [disabled]="isLoading"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
      >
        <span *ngIf="isLoading">
          Connexion en cours...
        </span>

        <span *ngIf="!isLoading">
          Se connecter
        </span>
      </button>
    </form>

    <!-- Message d'erreur -->
    <div
      *ngIf="errorMessage"
      class="error-message"
      role="alert"
      aria-live="assertive"
    >
      <strong>Erreur :</strong>
      {{ errorMessage }}
    </div>

    <p class="register-link">
      Vous n'avez pas de compte ?
      <a routerLink="/register">Créer un compte</a>
    </p>

  </div>
</div>
